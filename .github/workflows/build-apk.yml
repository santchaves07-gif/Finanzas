name: Generar APK de Tu Dinero Andres
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extraer el proyecto Android
        run: unzip -q Tu-Dinero-Andres-proyecto-APK.zip -d apk-project
      - name: Compilar APK
        run: gradle --no-daemon -p apk-project assembleDebug
      - name: Entregar APK
        uses: actions/upload-artifact@v4
        with:
          name: tu-dinero-andres-apk
          path: apk-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
