name: Generar APK de Tu Dinero Andres
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6
      - name: Preparar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Instalar Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extraer el proyecto Android
        run: unzip -q Tu-Dinero-Andres-proyecto-APK.zip -d apk-project
      - name: Compilar APK
        run: gradle --no-daemon -p apk-project assembleDebug
      - name: Adjuntar APK al artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: tu-dinero-andres-apk
          path: apk-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar APK para descarga directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.0
          name: Tu Dinero Andres APK
          make_latest: true
          files: apk-project/app/build/outputs/apk/debug/app-debug.apk
